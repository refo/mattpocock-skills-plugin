name: Sync upstream skills

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream and regenerate compatibility files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/sync-upstream.sh
          git diff --check

      - name: Create or update the sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/sync-mattpocock-skills
          delete-branch: true
          commit-message: "chore: sync mattpocock/skills"
          title: "chore: sync mattpocock/skills"
          body: |
            Syncs `upstream/main` and regenerates the Codex compatibility bundle.

            Generated by the manually dispatched **Sync upstream skills** workflow.
